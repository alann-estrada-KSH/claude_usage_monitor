name: Release

# Tag push (v1.2.3) builds Linux + Windows + Android, publishes the first
# two to a GitHub Release, republishes the apt repo (Linux) to GitHub Pages
# so `apt update && apt upgrade` picks up the new version, and uploads the
# phone Android build straight to the Play Store's internal track. See
# packaging/linux/build_deb.sh and packaging/windows/installer.iss for the
# actual packaging steps this just wires together, and the README for the
# apt install line end users run once.
#
# The wear module is a separate app sharing the phone's applicationId, but
# Play Console's "Wear OS" form factor is its own release segment with its
# own guided upload flow (Advanced settings > Form factors > Wear OS) --
# there's no known Play Developer API support for it yet, so this instead
# publishes wear-release.aab to its own DRAFT GitHub Release (tag
# wear-vX.Y.Z, never published -- this repo is public, and a signed build
# has no business being publicly downloadable) for manual upload there
# (that segment rejects a plain .apk).
#
# build-android needs three repo secrets (see android/key.properties and
# ~/keystores/ locally for what these mirror -- never committed):
#   ANDROID_KEYSTORE_BASE64  -- `base64 -w0` of the upload keystore .jks
#   ANDROID_KEY_PROPERTIES   -- raw contents of android/key.properties
#                                (storeFile line gets overwritten at build
#                                time to the path the runner decodes to,
#                                since the local one is this machine only)
#   PLAY_STORE_JSON_KEY      -- JSON key of a service account linked in
#                                Play Console (Settings > API access) with
#                                Release manager permission on this app
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux build + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libsecret-1-dev \
            dpkg-dev apt-utils

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Build .deb
        run: packaging/linux/build_deb.sh "${{ steps.version.outputs.version }}"

      - name: Publish .deb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: claude-usage-monitor_${{ steps.version.outputs.version }}_amd64.deb

      - name: Assemble apt repo
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf apt
          mkdir -p apt/pool/main apt/dists/stable/main/binary-amd64
          cp "claude-usage-monitor_${VERSION}_amd64.deb" apt/pool/main/
          cd apt
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          # apt-ftparchive, not a hand-written heredoc: apt needs the Date and
          # the SHA256 index hashes, and warns on every `apt update` without
          # them. Written to a temp file first so the scan doesn't checksum a
          # half-written Release inside the tree it's scanning.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Claude Usage Monitor" \
            -o APT::FTPArchive::Release::Label="Claude Usage Monitor" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Unofficial Claude Usage Monitor apt repo (unsigned, [trusted=yes])" \
            release dists/stable > /tmp/Release
          mv /tmp/Release dists/stable/Release

      - name: Publish apt repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apt
          destination_dir: apt
          keep_files: false

  build-windows:
    # Pinned, not windows-latest: flutter_inappwebview_windows (the Android
    # webview plugin's Windows stub -- unused at runtime on Windows, since
    # this app uses desktop_webview_window there, but still compiled since
    # federated plugins build for every platform they implement) uses
    # <experimental/coroutine>, which windows-latest's newer MSVC now hard
    # errors on (STL1011). windows-2022's MSVC still accepts it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion=${{ steps.version.outputs.version }} packaging\windows\installer.iss

      - name: Publish installer to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClaudeUsageMonitorSetup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Decode Android signing secrets
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/upload-keystore.jks"
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties
          # The committed key.properties' storeFile points at this developer's
          # machine (~/keystores/...) -- doesn't exist on the runner, so it's
          # rewritten to wherever the line above just decoded the keystore to.
          sed -i "s|^storeFile=.*|storeFile=$GITHUB_WORKSPACE/upload-keystore.jks|" android/key.properties

      - run: flutter pub get
      - run: flutter build appbundle --release
      - run: ./gradlew :wear:bundleRelease
        working-directory: android

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.claudeusagemonitor.claude_usage_monitor
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # Flutter's Gradle plugin enables R8 by default for release
          # builds (no explicit minifyEnabled in android/app/build.gradle.kts
          # needed) -- without this, Play Console warns that crash/ANR
          # reports can't be de-obfuscated back to real class/method names.
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: internal
          status: completed

      # Play Console's "Wear OS" form factor is a separate release segment
      # from the phone's -- it wants its own dedicated .aab uploaded through
      # its own guided flow (Play Console > Advanced settings > Form
      # factors > Wear OS), not embedded in the phone's bundle, and rejects
      # a plain .apk there ("Carga un paquete de aplicación válido"). No API
      # support for that segment is known yet (confirmed against the
      # androidpublisher v3 discovery doc -- edits.tracks has no
      # formFactor/device-segment concept), so publish the wear .aab for
      # manual upload instead. It goes to its own draft release (a
      # separate tag, never published) rather than the public vX.Y.Z one,
      # since this repo is public and a signed release build isn't meant
      # for random visitors to grab -- only repo collaborators can see a
      # draft release's assets.
      - name: Publish wear bundle to a draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wear-${{ github.ref_name }}
          name: Wear OS build ${{ github.ref_name }}
          draft: true
          files: build/wear/outputs/bundle/release/wear-release.aab
